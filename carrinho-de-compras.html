```html
<!DOCTYPE html>
<html lang="pt-br">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Carrinho - FoodFlex</title>


    <!-- =========================
         CSS
    ========================== -->

    <style>

        /* RESET */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        /* BODY */

        body {
            font-family: Arial, Helvetica, sans-serif;

            min-height: 100vh;

            background:
                linear-gradient(
                    135deg,
                    #0f2027,
                    #203a43,
                    #2c5364
                );

            color: #222;
        }


        /* HEADER */

        .header {
            width: 100%;

            padding: 20px 8%;

            display: flex;
            justify-content: space-between;
            align-items: center;

            background: rgba(255, 255, 255, 0.96);

            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
        }


        .logo {
            font-size: 26px;

            font-weight: bold;

            color: #1c7c54;
        }


        .voltar {
            text-decoration: none;

            color: #1c7c54;

            font-weight: bold;

            transition: 0.3s;
        }


        .voltar:hover {
            color: #125239;
        }


        /* CONTAINER PRINCIPAL */

        .carrinho-container {

            width: 90%;

            max-width: 1200px;

            margin: 50px auto;

            display: grid;

            grid-template-columns: 2fr 1fr;

            gap: 30px;
        }


        /* ÁREA DO CARRINHO */

        .carrinho {

            background: white;

            padding: 30px;

            border-radius: 20px;

            box-shadow:
                0 10px 30px rgba(0, 0, 0, 0.2);
        }


        .carrinho h1 {

            margin-bottom: 25px;

            color: #1c7c54;
        }


        /* PRODUTO */

        .produto {

            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 20px;

            padding: 20px 0;

            border-bottom: 1px solid #ddd;
        }


        .produto-info {

            flex: 1;
        }


        .produto-info h3 {

            margin-bottom: 6px;
        }


        .produto-info p {

            color: #777;
        }


        .preco {

            font-weight: bold;

            color: #1c7c54;

            white-space: nowrap;
        }


        /* QUANTIDADE */

        .quantidade {

            display: flex;

            align-items: center;

            gap: 10px;
        }


        .quantidade button {

            width: 32px;

            height: 32px;

            border: none;

            border-radius: 8px;

            background: #1c7c54;

            color: white;

            font-size: 18px;

            cursor: pointer;

            transition: 0.2s;
        }


        .quantidade button:hover {

            background: #125239;

            transform: scale(1.05);
        }


        .quantidade span {

            font-weight: bold;

            min-width: 20px;

            text-align: center;
        }


        /* BOTÃO REMOVER */

        .remover {

            border: none;

            background: transparent;

            color: #d9534f;

            cursor: pointer;

            font-size: 20px;

            transition: 0.2s;
        }


        .remover:hover {

            color: #a8322e;

            transform: scale(1.1);
        }


        /* RESUMO */

        .resumo {

            height: fit-content;

            background: white;

            padding: 30px;

            border-radius: 20px;

            box-shadow:
                0 10px 30px rgba(0, 0, 0, 0.2);
        }


        .resumo h2 {

            margin-bottom: 25px;

            color: #1c7c54;
        }


        .linha {

            display: flex;

            justify-content: space-between;

            margin-bottom: 18px;

            color: #555;
        }


        .resumo hr {

            margin: 20px 0;

            border: none;

            border-top: 1px solid #ddd;
        }


        .total {

            display: flex;

            justify-content: space-between;

            align-items: center;

            font-size: 20px;
        }


        .total strong {

            color: #1c7c54;
        }


        /* BOTÃO FINALIZAR */

        .finalizar {

            width: 100%;

            margin-top: 25px;

            padding: 15px;

            border: none;

            border-radius: 12px;

            background: #1c7c54;

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.3s;
        }


        .finalizar:hover {

            background: #125239;

            transform: translateY(-2px);
        }


        /* CARRINHO VAZIO */

        .vazio {

            text-align: center;

            padding: 50px 20px;

            color: #777;
        }


        .vazio h2 {

            margin-bottom: 10px;
        }


        /* RESPONSIVO */

        @media (max-width: 800px) {

            .header {

                padding: 18px 5%;
            }


            .carrinho-container {

                grid-template-columns: 1fr;

                width: 94%;

                margin: 30px auto;
            }


            .produto {

                flex-wrap: wrap;
            }

        }

    </style>

</head>


<body>


    <!-- =========================
         HEADER
    ========================== -->

    <header class="header">

        <div class="logo">
            🍴 FoodFlex
        </div>


        <a href="#" class="voltar">
            ← Voltar para o cardápio
        </a>

    </header>



    <!-- =========================
         CONTEÚDO
    ========================== -->

    <main class="carrinho-container">


        <!-- CARRINHO -->

        <section class="carrinho">

            <h1>🛒 Meu Carrinho</h1>


            <div id="listaCarrinho">
                <!--
                    Os produtos serão
                    adicionados pelo JavaScript.
                -->

            </div>

        </section>



        <!-- RESUMO -->

        <aside class="resumo">

            <h2>Resumo da compra</h2>


            <div class="linha">

                <span>
                    Subtotal
                </span>

                <span id="subtotal">
                    R$ 0,00
                </span>

            </div>


            <div class="linha">

                <span>
                    Entrega
                </span>

                <span id="entrega">
                    R$ 0,00
                </span>

            </div>


            <hr>


            <div class="total">

                <span>
                    Total
                </span>

                <strong id="total">
                    R$ 0,00
                </strong>

            </div>


            <button
                class="finalizar"
                onclick="finalizarCompra()">

                Finalizar compra

            </button>

        </aside>


    </main>



    <!-- =========================
         JAVASCRIPT
    ========================== -->

    <script>


        // =====================================
        // CARRINHO
        // =====================================

        let carrinho =
            JSON.parse(
                localStorage.getItem("carrinho")
            ) || [

                {
                    id: 1,

                    nome: "Bowl de Frango",

                    preco: 25.90,

                    quantidade: 1
                },


                {
                    id: 2,

                    nome: "Salada Fitness",

                    preco: 19.90,

                    quantidade: 2
                }

            ];



        // =====================================
        // SALVAR CARRINHO
        // =====================================

        function salvarCarrinho() {

            localStorage.setItem(
                "carrinho",

                JSON.stringify(carrinho)
            );

        }



        // =====================================
        // FORMATAR PREÇO
        // =====================================

        function formatarPreco(valor) {

            return valor.toLocaleString(
                "pt-BR",

                {
                    style: "currency",

                    currency: "BRL"
                }
            );

        }



        // =====================================
        // MOSTRAR CARRINHO
        // =====================================

        function mostrarCarrinho() {

            const lista =
                document.getElementById(
                    "listaCarrinho"
                );


            lista.innerHTML = "";



            // CARRINHO VAZIO

            if (carrinho.length === 0) {

                lista.innerHTML = `

                    <div class="vazio">

                        <h2>
                            Seu carrinho está vazio 🛒
                        </h2>

                        <p>
                            Adicione alguns pratos
                            deliciosos para continuar.
                        </p>

                    </div>

                `;


                atualizarResumo();

                return;
            }



            // PRODUTOS

            carrinho.forEach(
                function(produto) {

                    const div =
                        document.createElement(
                            "div"
                        );


                    div.classList.add(
                        "produto"
                    );



                    div.innerHTML = `

                        <div class="produto-info">

                            <h3>
                                ${produto.nome}
                            </h3>

                            <p>
                                ${formatarPreco(
                                    produto.preco
                                )}
                                cada
                            </p>

                        </div>


                        <div class="quantidade">

                            <button
                                onclick="
                                diminuirQuantidade(
                                    ${produto.id}
                                )">

                                −

                            </button>


                            <span>
                                ${produto.quantidade}
                            </span>


                            <button
                                onclick="
                                aumentarQuantidade(
                                    ${produto.id}
                                )">

                                +

                            </button>

                        </div>


                        <strong class="preco">

                            ${formatarPreco(
                                produto.preco *
                                produto.quantidade
                            )}

                        </strong>


                        <button
                            class="remover"

                            onclick="
                            removerProduto(
                                ${produto.id}
                            )">

                            🗑️

                        </button>

                    `;


                    lista.appendChild(div);

                }
            );



            atualizarResumo();

        }



        // =====================================
        // AUMENTAR QUANTIDADE
        // =====================================

        function aumentarQuantidade(id) {

            const produto =
                carrinho.find(
                    function(item) {

                        return item.id === id;

                    }
                );


            if (produto) {

                produto.quantidade++;

            }


            salvarCarrinho();

            mostrarCarrinho();

        }



        // =====================================
        // DIMINUIR QUANTIDADE
        // =====================================

        function diminuirQuantidade(id) {

            const produto =
                carrinho.find(
                    function(item) {

                        return item.id === id;

                    }
                );


            if (!produto) {

                return;

            }


            if (produto.quantidade > 1) {

                produto.quantidade--;

            }

            else {

                removerProduto(id);

                return;

            }


            salvarCarrinho();

            mostrarCarrinho();

        }



        // =====================================
        // REMOVER PRODUTO
        // =====================================

        function removerProduto(id) {

            carrinho =
                carrinho.filter(
                    function(produto) {

                        return produto.id !== id;

                    }
                );


            salvarCarrinho();

            mostrarCarrinho();

        }



        // =====================================
        // ATUALIZAR RESUMO
        // =====================================

        function atualizarResumo() {

            let subtotal = 0;



            carrinho.forEach(
                function(produto) {

                    subtotal +=
                        produto.preco *
                        produto.quantidade;

                }
            );



            // Taxa de entrega

            const taxaEntrega =
                carrinho.length > 0
                    ? 5
                    : 0;



            // Total

            const total =
                subtotal +
                taxaEntrega;



            document.getElementById(
                "subtotal"
            ).textContent =
                formatarPreco(subtotal);



            document.getElementById(
                "entrega"
            ).textContent =
                formatarPreco(taxaEntrega);



            document.getElementById(
                "total"
            ).textContent =
                formatarPreco(total);

        }



        // =====================================
        // FINALIZAR COMPRA
        // =====================================

        function finalizarCompra() {

            if (carrinho.length === 0) {

                alert(
                    "Seu carrinho está vazio!"
                );

                return;

            }



            const total =
                document.getElementById(
                    "total"
                ).textContent;



            alert(
                "🎉 Pedido realizado com sucesso!\n\n" +
                "Valor total: " + total
            );



            // Limpar carrinho

            carrinho = [];


            salvarCarrinho();


            mostrarCarrinho();

        }



        // =====================================
        // INICIAR PÁGINA
        // =====================================

        mostrarCarrinho();

    </script>


</body>

</html>
```
